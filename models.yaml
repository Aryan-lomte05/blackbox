# models.yaml: the ONLY place a model is named (CLAUDE.md hard rule 1).
# Code uses the ids. Check that every tag exists:
#   py -3 -m blackbox.recorder.providers verify
# Tags change often; if verify says MISSING, fix the tag here, nowhere else.

- id: agent-small          # default brain of the test agents (fast lane)
  provider: groq
  model: llama-3.1-8b-instant
  params: {temperature: 0, seed: 7}

- id: agent-local          # local volume + natural failures (Advay/Radhesh machines)
  provider: ollama
  model: qwen2.5:3b
  params: {temperature: 0, seed: 7}

- id: agent-local-7b       # Aryan's 4060
  provider: ollama
  model: qwen2.5:7b
  params: {temperature: 0, seed: 7}

# OpenRouter keys are free-tier: only ":free" models, ~50 requests/day per account.
# Keep them for the few big-model jobs; bulk run generation goes to local Ollama.
# Measured 3 Oct: nemotron-3-super 0.4 s, qwen3.8-27b 1.1 s, gemma-4-31b rate-limited upstream.
- id: agent-local-14b      # local repair model for labelling 7B failures (spills past 8 GB: slow, free, no rate limit)
  provider: ollama
  model: qwen2.5:14b
  params: {temperature: 0, seed: 7}

- id: agent-strong         # repair attempts in Verify / Autopilot
  provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b:free
  params: {temperature: 0}

- id: judge-large          # LLM-judge baseline, GenAI fixes, incident report, red-team mistakes
  provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b:free
  params: {temperature: 0.2}

- id: overflow             # second free large model when the first is rate-limited
  provider: openrouter
  model: qwen/qwen3.8-27b:free
  params: {temperature: 0}

- id: monitor-llm          # step-checker fallback
  provider: groq
  model: llama-3.1-8b-instant
  params:
    temperature: 0
    max_tokens: 150

